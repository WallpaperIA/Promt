<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Wallpaperia · Prueba de interfaz</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#202329;color:#f4f5f7;font:14px system-ui}
    header{padding:12px 18px;background:#101217;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    h1{font-size:16px;margin:0}p{margin:0;color:#c4cad4}label{display:flex;gap:8px;align-items:center}
    select,button{font:inherit;min-height:36px;border:1px solid #687282;border-radius:6px;padding:6px;background:#272d38;color:white}
    #estado{width:100%;font-size:12px;color:#d0d8e8}main{padding:12px;overflow:auto}iframe{display:block;height:820px;border:1px solid #697383;margin:auto;background:#08080d}
  </style>
  <script src="../data/catalog.js"></script>
</head>
<body>
  <header>
    <h1>Prueba sintética de Wallpaperia</h1>
    <p>Sin cuentas, prompts ni fotos reales. No contacta las API ni guarda datos en el navegador.</p>
    <label>Perfil <select id="perfil"><option value="anon">Visitante</option><option value="free">Gratis</option><option value="premium">Premium</option><option value="full">Full</option><option value="full-sin-sesion">Full almacenado sin sesión</option></select></label>
    <label>Ancho <select id="ancho"><option value="1280">Escritorio · 1280 px</option><option value="768">Tablet · 768 px</option><option value="390">Celular · 390 px</option><option value="320">Celular · 320 px</option></select></label>
    <button id="recargar" type="button">Reiniciar prueba</button>
    <output id="estado" aria-live="polite">Cargando el código público…</output>
  </header>
  <main><iframe id="app" title="Wallpaperia con datos de prueba" sandbox="allow-scripts allow-same-origin" allow="clipboard-write"></iframe></main>
  <script>
    // Es una API falsa dentro del iframe, no un permiso para entrar al servicio.
    // Los cinco IDs son fixtures de este test; el sitio real sigue usando /api/catalog.
    const gratis=['beach-wet-dress','predatory-lean','recostada-macrame','escenario-dorado','tank-recostada'];
    const fotos=[...new Set([...['casual','editorial','hot','xxx'].flatMap(t=>CATEGORIES.filter(c=>c.tier===t).slice(0,3).map(c=>c.id)),...gratis])];
    const app=document.getElementById('app'),perfil=document.getElementById('perfil'),ancho=document.getElementById('ancho'),estado=document.getElementById('estado');
    let fuente='',turno=0;
    function preparar(d){
      // Memoria del fixture: nunca leer o escribir el localStorage real del host.
      const memoria=new Map([['wp_edad_v1','1']]);
      const storage={getItem:k=>memoria.get(k)??null,setItem:(k,v)=>memoria.set(k,String(v)),removeItem:k=>memoria.delete(k),clear:()=>memoria.clear(),key:i=>[...memoria.keys()][i]??null,get length(){return memoria.size}};
      Object.defineProperty(window,'localStorage',{value:storage,configurable:true});
      if(d.perfil!=='anon'&&d.perfil!=='full-sin-sesion'){
        storage.setItem('wp_session_v1','sesion-sintetica-'+d.tier);
        storage.setItem('wp_ptier_v1',d.tier);storage.setItem('wp_pname_v1','Cuenta sintética');
      }else if(d.perfil==='full-sin-sesion')storage.setItem('wp_ptier_v1','full');
      const json=(estado,cuerpo)=>new Response(JSON.stringify(cuerpo),{status:estado,headers:{'Content-Type':'application/json','Cache-Control':'private, no-store'}});
      const puedePrompt=c=>d.tier==='full'||(c.ready&&(d.tier==='premium'?c.tier!=='xxx':d.gratis.includes(c.id)));
      const puedeFoto=c=>['casual','editorial'].includes(c.tier)||d.tier==='full'||(d.tier==='premium'&&c.tier==='hot');
      const variantes=c=>Object.fromEntries(c.variants.map(v=>[v,'MARCADOR SINTÉTICO '+c.id+' · '+v+' · '+(v.startsWith('trio')?'__N1__ / __N2__ / __N3__':v.startsWith('duo')?'__N1__ / __N2__':'__N__')+'.']));
      window.fetch=async(entrada,opciones={})=>{
        const u=new URL(typeof entrada==='string'?entrada:entrada.url,d.origen);
        const c=d.categorias.find(c=>c.id===u.searchParams.get('id'));
        if(u.pathname==='/api/catalog')return json(200,{categorias:[],eliminadas:[],conEjemplos:d.fotos,gratis:d.gratis,esAdmin:false});
        if(u.pathname==='/api/auth/verify')return json(200,{tier:d.tier,name:'Cuenta sintética',esAdmin:false});
        if(u.pathname==='/api/auth/logout')return json(200,{ok:true});
        if(u.pathname==='/api/ejemplos'){
          if(!c)return json(404,{error:'not_found'});
          if(!puedeFoto(c))return json(403,{error:'needs_upgrade',tier:d.tier,hay:2});
          return json(200,{id:c.id,imagenes:d.fotos.includes(c.id)?[d.origen+'/assets/favicon.svg',d.origen+'/assets/favicon.svg']:[]});
        }
        if(u.pathname==='/api/prompt'){
          if(u.searchParams.get('todas')==='1')return json(200,{tier:d.tier,prompts:Object.fromEntries(d.categorias.filter(puedePrompt).map(c=>[c.id,variantes(c).prompt]))});
          if(!c)return json(404,{error:'not_found'});
          if(!puedePrompt(c))return json(403,{error:'needs_upgrade',tier:d.tier});
          return json(200,{id:c.id,tier:d.tier,prompts:variantes(c)});
        }
        if(u.pathname==='/api/versiones')return d.tier==='full'?json(200,{versiones:[],total:0}):json(403,{error:'needs_upgrade'});
        return json(404,{error:'ruta_fuera_del_fixture'});
      };
      // Un click de prueba no debe abrir Patreon ni salir hacia otro servicio.
      document.addEventListener('click',e=>{if(e.target.closest('a[href],.patreon-login-btn')){e.preventDefault();e.stopImmediatePropagation();}},{capture:true});
      window.addEventListener('error',e=>parent.postMessage({qa:true,turno:d.turno,error:String(e.message)},d.origen));
      window.addEventListener('unhandledrejection',e=>parent.postMessage({qa:true,turno:d.turno,error:String(e.reason?.message||e.reason)},d.origen));
    }
    function cargar(){
      const p=perfil.value,tier=['premium','full'].includes(p)?p:'free';
      const esperadas=fotos.filter(id=>{const c=CATEGORIES.find(c=>c.id===id);return c&&(['casual','editorial'].includes(c.tier)||tier==='full'||(tier==='premium'&&c.tier==='hot'));}).length;
      const d={perfil:p,tier,gratis,fotos,categorias:CATEGORIES,origen:location.origin,turno:++turno};
      const datos=JSON.stringify(d).replace(/</g,'\\u003c');
      const inicio='<base href="'+location.origin+'/"><script>('+preparar.toString()+')('+datos+');<\/script>';
      app.style.width=ancho.value+'px';
      estado.textContent='Perfil '+perfil.selectedOptions[0].textContent+' · '+CATEGORIES.length+' escenas sintéticas · '+esperadas+' fotos visibles esperadas · '+ancho.value+' px';
      app.srcdoc=fuente.replace('<head>','<head>'+inicio).replace(/const API_BASE =[^;]+;/,"const API_BASE = '';" ).replace(/const UMAMI_ID = '[^']*';/,"const UMAMI_ID = '';" );
    }
    addEventListener('message',e=>{if(e.source===app.contentWindow&&e.data?.qa&&e.data.turno===turno)estado.textContent+=' · ERROR: '+e.data.error;});
    perfil.addEventListener('change',cargar);ancho.addEventListener('change',()=>{app.style.width=ancho.value+'px';estado.textContent=estado.textContent.replace(/\d+ px$/,ancho.value+' px');});document.getElementById('recargar').addEventListener('click',cargar);
    fetch('../index.html').then(r=>{if(!r.ok)throw new Error('No se pudo cargar el HTML público');return r.text();}).then(html=>{fuente=html;cargar();}).catch(e=>{estado.textContent=e.message;});
  </script>
</body>
</html>
