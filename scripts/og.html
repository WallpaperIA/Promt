<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0A0A0C;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;justify-content:center;padding:0 82px;position:relative;overflow:hidden}
.glow{position:absolute;top:-360px;right:-200px;width:900px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(218,127,32,.16),transparent 66%)}
.mark{display:flex;align-items:center;gap:13px;margin-bottom:34px}
.mark span{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#7A7A85}
h1{font-size:74px;font-weight:800;line-height:1.06;color:#F2F2F5;letter-spacing:-.022em}
h1 em{font-style:normal;color:#DA7F20;display:block}
p{margin-top:26px;font-size:24px;line-height:1.5;color:#9A9AA5;max-width:820px}
.chips{display:flex;gap:11px;margin-top:40px;flex-wrap:wrap}
.chip{border:1px solid #26262C;background:#141418;border-radius:40px;padding:10px 20px;
  font-size:18px;color:#9A9AA5}
.chip b{color:#F2F2F5;font-weight:700}
</style></head><body>
<div class="glow"></div>
<div class="mark">
  <svg width="40" height="40" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#141418"/>
  <g fill="none" stroke="#DA7F20" stroke-width="4" stroke-linecap="round">
  <path d="M18 24v-4a2 2 0 0 1 2-2h4"/><path d="M46 24v-4a2 2 0 0 0-2-2h-4"/>
  <path d="M18 40v4a2 2 0 0 0 2 2h4"/><path d="M46 40v4a2 2 0 0 1-2 2h-4"/></g>
  <circle cx="32" cy="32" r="7" fill="#DA7F20"/></svg>
  <span>Wallpaperia</span>
</div>
<h1>Generá imágenes que parecen<em>portadas de revista.</em></h1>
<p>Prompts de fotografía editorial listos para pegar en cualquier IA generativa. Piel real, luz real.</p>
<div class="chips">
  <div class="chip"><b>{{escenas}}</b> escenas</div>
  <div class="chip"><b>{{prendas}}</b> prendas</div>
  <div class="chip"><b>{{detalles}}</b> detalles</div>
  <div class="chip"><b>{{estilos}}</b> estilos</div>
  <div class="chip">Dúo &amp; Trío</div>
</div>
</body></html>
