name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Versiones que corren en Node 24. Desde el 23/09/2026 GitHub no tiene
      # Node 20: las anteriores andaban forzadas y dejaban un aviso.
      # Van fijadas por commit y no por etiqueta: una etiqueta se puede mover,
      # y este trabajo tiene permiso para publicar el sitio. El comentario
      # dice qué versión es; para actualizar, cambiar los dos juntos.
      # persist-credentials: false porque ningún paso hace push: así el token
      # no queda en .git/config al alcance de lo que corre `npm ci`.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # Sólo para minificar index.html: el sitio sigue sin build step propio.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npm ci
      # Publicar sólo el sitio estático. Con `path: .` se subía también api/,
      # dejando el código de las funciones serverless servido en Pages.
      # Se listan los archivos uno por uno a propósito. Copiar la carpeta data/
      # entera publicaba también data/prompts.js, que son los 1188 prompts
      # completos: justo lo que el gating por servidor viene a evitar.
      - name: Preparar artefacto del sitio
        run: node scripts/build-site.mjs _site

      # Falla el deploy antes de publicar si se coló algo que no debería estar.
      - name: Comprobar que no se publica contenido privado
        run: |
          if [ -e _site/data/prompts.js ] || [ -e _site/api ]; then
            echo "El artefacto contiene archivos que no deben publicarse:"
            find _site -name 'prompts.js' -o -name 'api' -o -name '*.seed.json'
            exit 1
          fi
          echo "Archivos a publicar:"
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
