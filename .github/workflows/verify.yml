name: Verificaciones públicas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Todos los tests usan módulos de Node y fixtures locales; no necesitan
      # Supabase, Patreon ni la fuente privada de prompts. npm ci instala
      # esbuild, que usa la prueba de la página minificada.
      - run: npm ci
      - run: npm run verify:public

  integridad-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pruebas-locales
          POSTGRES_DB: wallpaperia_pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: pruebas-locales
      PGDATABASE: wallpaperia_pruebas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/verify-integridad-db.mjs
